<aside class="sidebar">
  <div class="sidebar__rail">
    <div class="sidebar__logo">HS</div>

    <nav class="sidebar__rail-nav">
      @for (icon of railIcons; track icon) {
        <button type="button" class="rail-icon" [class.rail-icon--active]="icon === 'grid'">
          <ui-icon [name]="icon" [size]="18" />
        </button>
      }
    </nav>

    <div class="sidebar__rail-footer">
      <div class="avatar">HN</div>
    </div>
  </div>

  <button
    type="button"
    class="collapse-btn"
    [class.collapse-btn--collapsed]="collapsed()"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    (click)="toggleCollapsed()"
  >
    <span class="collapse-btn__icon" [class.collapse-btn__icon--flipped]="collapsed()">
      <ui-icon name="chevron-left" [size]="16" />
    </span>
  </button>

  <div class="sidebar__nav" [class.sidebar__nav--collapsed]="collapsed()">
    <div class="sidebar__nav-header">
      <span class="sidebar__brand">HamroSchool</span>
    </div>

    @for (section of sections; track section.title) {
      <div class="nav-section">
        <span class="nav-section__title">{{ section.title }}</span>
        @for (item of section.items; track item.label) {
          @if (item.link) {
            <a
              class="nav-item"
              [routerLink]="item.link"
              routerLinkActive="nav-item--active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              <ui-icon [name]="item.icon" [size]="17" />
              <span>{{ item.label }}</span>
            </a>
          } @else {
            <span class="nav-item nav-item--disabled">
              <ui-icon [name]="item.icon" [size]="17" />
              <span>{{ item.label }}</span>
            </span>
          }
        }
      </div>
    }

    <div class="sidebar__nav-footer">
      <div class="nav-item nav-item--toggle">
        <ui-icon [name]="darkMode() ? 'moon' : 'sun'" [size]="17" />
        <span>Dark mode</span>
        <button type="button" class="switch" [class.switch--on]="darkMode()" (click)="toggleDarkMode()">
          <span class="switch__thumb"></span>
        </button>
      </div>

      <div class="user-card">
        <div class="avatar">HN</div>
        <div class="user-card__info">
          <span class="user-card__name">Harper Nelson</span>
          <span class="user-card__role">Admin Manager</span>
        </div>
      </div>

      <span class="nav-item">
        <ui-icon name="logout" [size]="17" />
        <span>Log out</span>
      </span>
    </div>
  </div>
</aside>
