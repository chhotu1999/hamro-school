<h2 mat-dialog-title>{{ isEdit ? 'Edit student' : 'Add student' }}</h2>

<mat-dialog-content>
  <form [formGroup]="formGroup" class="student-form">
    <mat-form-field appearance="outline" class="field">
      <mat-label>Roll No</mat-label>
      <input matInput type="number" formControlName="rollNo" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Role Id</mat-label>
      <input matInput type="number" formControlName="roleId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Date of Birth</mat-label>
      <input matInput [matDatepicker]="dobPicker" formControlName="dob" />
      <mat-datepicker-toggle matSuffix [for]="dobPicker" />
      <mat-datepicker #dobPicker />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Gender List Item Id</mat-label>
      <input matInput type="number" formControlName="genderListItemId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Academic Year Id</mat-label>
      <input matInput type="number" formControlName="academicYearId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Grade Id</mat-label>
      <input matInput type="number" formControlName="gradeId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Grade Section Id</mat-label>
      <input matInput type="number" formControlName="gradeSectionId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Student Status List Item Id</mat-label>
      <input matInput type="number" formControlName="studentStatusListItemId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Blood Group List Item Id</mat-label>
      <input matInput type="number" formControlName="bloodGroupListItemId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field field--full">
      <mat-label>Permanent Address</mat-label>
      <input matInput formControlName="permanentAddress" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field field--full">
      <mat-label>Current Address</mat-label>
      <input matInput formControlName="currentAddress" />
    </mat-form-field>
  </form>

  @if (errorMessage) {
    <p class="form-error">{{ errorMessage }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="saving" (click)="submitForm()">
    {{ saving ? 'Saving…' : 'Save' }}
  </button>
</mat-dialog-actions>
