<app-layout title="Students">
  <div class="site-content">
    <div class="site-content-header">
      <div class="search-bar">
        <mat-form-field appearance="outline" class="search-field">
          <mat-label>Search</mat-label>
          <input matInput (keydown.enter)="searchChange($event)" placeholder="Name, guardian or grade" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Grade</mat-label>
          <mat-select [(ngModel)]="gradeFilter" (selectionChange)="onFilterChange()">
            <mat-option value="">All grades</mat-option>
            @for (grade of gradeOptions; track grade) {
              <mat-option [value]="grade">{{ grade }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Fee status</mat-label>
          <mat-select [(ngModel)]="feeStatusFilter" (selectionChange)="onFilterChange()">
            <mat-option value="">All fee status</mat-option>
            @for (status of feeStatusOptions; track status) {
              <mat-option [value]="status">{{ status }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="flex-1 toolbar-actions">
        <button type="button" class="add-btn">
          <ui-icon name="plus" [size]="16" />
          <span>Add student</span>
        </button>
      </div>
    </div>

    <ui-card>
      <mat-grid [config]="gridConfig" (onPageChange)="onPageChange($event)" (onSortChange)="onSortChange($event)">
        <ng-template matCellFor="student" let-student>
          <div class="student-cell">
            <span class="avatar" [style.background]="student.avatarColor">{{ student.initials }}</span>
            <span>{{ student.name }}</span>
          </div>
        </ng-template>

        <ng-template matCellFor="attendance" let-student>
          <span [class]="attendanceClass(student.attendance)">{{ student.attendance }}%</span>
        </ng-template>

        <ng-template matCellFor="feeStatus" let-student>
          <span [class]="feeStatusClass(student.feeStatus)">{{ student.feeStatus }}</span>
        </ng-template>

        <ng-template matCellFor="actions" let-student>
          <div class="row-actions">
            <button type="button" class="icon-btn">
              <ui-icon name="eye" [size]="15" />
            </button>
            <button type="button" class="icon-btn icon-btn--danger">
              <ui-icon name="trash" [size]="15" />
            </button>
          </div>
        </ng-template>
      </mat-grid>
    </ui-card>
  </div>
</app-layout>
