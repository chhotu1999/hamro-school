<app-layout title="Students">
  <button type="button" class="add-btn" layoutActions>
    <ui-icon name="plus" [size]="16" />
    <span>Add student</span>
  </button>

  <ui-card>
    <data-grid
      [rows]="students"
      [columns]="columns"
      [filters]="filters"
      [searchableKeys]="searchableKeys"
      searchPlaceholder="Search by name, guardian or grade"
      emptyMessage="No students match your search."
      [initialPage]="page()"
      [trackBy]="trackById"
      (pageChange)="onPageChange($event)"
    >
      <ng-template uiCellFor="student" let-student>
        <div class="student-cell">
          <span class="avatar" [style.background]="student.avatarColor">{{ student.initials }}</span>
          <span>{{ student.name }}</span>
        </div>
      </ng-template>

      <ng-template uiCellFor="attendance" let-student>
        <span [class]="attendanceClass(student.attendance)">{{ student.attendance }}%</span>
      </ng-template>

      <ng-template uiCellFor="feeStatus" let-student>
        <span [class]="feeStatusClass(student.feeStatus)">{{ student.feeStatus }}</span>
      </ng-template>

      <ng-template uiCellFor="actions" let-student>
        <div class="row-actions">
          <button type="button" class="icon-btn">
            <ui-icon name="eye" [size]="15" />
          </button>
          <button type="button" class="icon-btn icon-btn--danger">
            <ui-icon name="trash" [size]="15" />
          </button>
        </div>
      </ng-template>
    </data-grid>
  </ui-card>
</app-layout>
