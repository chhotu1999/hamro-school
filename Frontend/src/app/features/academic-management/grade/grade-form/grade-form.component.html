<h2 mat-dialog-title>{{ isEdit ? 'Edit class' : 'Add class' }}</h2>

<mat-dialog-content>
  <form [formGroup]="formGroup" class="grade-form">
    <mat-form-field appearance="outline" class="field field--full">
      <mat-label>Class Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Grade 10" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Class Teacher Id</mat-label>
      <input matInput type="number" formControlName="gradeTeacherId" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Shift Start Time</mat-label>
      <input matInput formControlName="shiftStartTime" placeholder="HH:mm:ss" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Shift End Time</mat-label>
      <input matInput formControlName="shiftEndTime" placeholder="HH:mm:ss" />
    </mat-form-field>
  </form>

  @if (errorMessage) {
    <p class="form-error">{{ errorMessage }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="saving" (click)="submitForm()">
    {{ saving ? 'Saving…' : 'Save' }}
  </button>
</mat-dialog-actions>
