<div class="auth">
  <div class="auth__panel">
    <a class="auth__brand" routerLink="/">
      <span class="auth__logo"><ui-icon name="graduation-cap" [size]="20" /></span>
      <span>HamroSchool</span>
    </a>

    <h1 class="auth__headline">Welcome to the school portal</h1>
    <p class="auth__copy">
      Sign in to manage students, staff, academics and everything else that keeps HamroSchool running
      smoothly.
    </p>
  </div>

  <div class="auth__card">
    <div class="tabs">
      <button
        type="button"
        class="tabs__item"
        [class.tabs__item--active]="mode() === 'login'"
        (click)="switchMode('login')"
      >
        Login
      </button>
      <button
        type="button"
        class="tabs__item"
        [class.tabs__item--active]="mode() === 'register'"
        (click)="switchMode('register')"
      >
        Create Account
      </button>
    </div>

    @if (errorMessage()) {
      <div class="banner banner--error">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="banner banner--success">{{ successMessage() }}</div>
    }

    @if (mode() === 'login') {
      <form class="form" [formGroup]="loginForm" (ngSubmit)="submitLogin()">
        <label class="field">
          <span class="field__label">Username</span>
          <span class="field__control">
            <ui-icon name="user" [size]="17" />
            <input type="text" formControlName="username" autocomplete="username" placeholder="Enter your username" />
          </span>
          @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
            <span class="field__error">Username is required.</span>
          }
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <span class="field__control">
            <ui-icon name="lock" [size]="17" />
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Enter your password"
            />
            <button
              type="button"
              class="field__toggle"
              [class.field__toggle--active]="showPassword()"
              (click)="toggleShowPassword()"
              aria-label="Toggle password visibility"
            >
              <ui-icon name="eye" [size]="16" />
            </button>
          </span>
          @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <span class="field__error">Password is required.</span>
          }
        </label>

        <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
          {{ submitting() ? 'Signing in…' : 'Login' }}
        </button>
      </form>
    } @else {
      <form class="form" [formGroup]="registerForm" (ngSubmit)="submitRegister()">
        <label class="field">
          <span class="field__label">Username</span>
          <span class="field__control">
            <ui-icon name="user" [size]="17" />
            <input type="text" formControlName="username" autocomplete="username" placeholder="Choose a username" />
          </span>
          @if (registerForm.get('username')?.invalid && registerForm.get('username')?.touched) {
            <span class="field__error">Username must be at least 3 characters.</span>
          }
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <span class="field__control">
            <ui-icon name="lock" [size]="17" />
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              placeholder="At least 6 characters"
            />
            <button type="button" class="field__toggle" (click)="toggleShowPassword()" aria-label="Toggle password visibility">
              <ui-icon name="eye" [size]="16" />
            </button>
          </span>
          @if (registerForm.get('password')?.invalid && registerForm.get('password')?.touched) {
            <span class="field__error">Password must be at least 6 characters.</span>
          }
        </label>

        <label class="field">
          <span class="field__label">Confirm Password</span>
          <span class="field__control">
            <ui-icon name="lock" [size]="17" />
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              placeholder="Re-enter your password"
            />
          </span>
        </label>

        <label class="field">
          <span class="field__label">Role</span>
          <span class="field__control field__control--select">
            <ui-icon name="shield" [size]="17" />
            <select formControlName="roleId">
              <option [ngValue]="null" disabled>{{ rolesLoading() ? 'Loading roles…' : 'Select a role' }}</option>
              @for (role of roles(); track role.id) {
                <option [ngValue]="role.id">{{ role.name }}</option>
              }
            </select>
          </span>
          @if (registerForm.get('roleId')?.invalid && registerForm.get('roleId')?.touched) {
            <span class="field__error">Please select a role.</span>
          }
        </label>

        <button type="submit" class="btn btn--primary btn--block" [disabled]="submitting()">
          {{ submitting() ? 'Creating account…' : 'Create Account' }}
        </button>
      </form>
    }
  </div>
</div>
